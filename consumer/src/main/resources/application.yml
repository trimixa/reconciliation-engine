# 1. The Application Port
server:
  port: 8081

spring:
  application:
    name: consumer

  # 2. The Conveyor Belt (Kafka)
  kafka:
    bootstrap-servers: 127.0.0.1:19092
    consumer:
      group-id: reconciliation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        # Ignore the Producer's shipping label
        spring.json.use.type.headers: false
        # Force the JSON into the Consumer's local blueprint
        spring.json.value.default.type: com.maang.reconciliation.consumer.domain.Transaction

  # 3. The Temporary Cache (Redis)
  data:
    redis:
      host: localhost
      port: 16379

  # 4. The Permanent Vault (PostgreSQL)
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/bank_reconciliation
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  # 5. The Magic Table Builder (Hibernate)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Tracing & Observability
management:
  tracing:
    sampling:
      probability: 1.0 # Trace 100% of requests for development
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker:
  instances:
    databaseService:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
      recordExceptions:
        - java.io.IOException
