apiVersion: v1
kind: Service
metadata:
  name: consumer-service
spec:
  type: NodePort
  selector:
    app: consumer
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: producer-service
spec:
  type: ClusterIP
  selector:
    app: producer
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
